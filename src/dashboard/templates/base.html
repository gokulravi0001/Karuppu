<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Antigravity Security Suite" }}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        discord: {
                            blurple: '#5865F2',
                            dark: '#1e1f22',
                            darker: '#141518',
                            card: '#2b2d31',
                            hover: '#35373c',
                            green: '#57F287',
                            red: '#ED4245',
                            gold: '#FEE75C'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-discord-darker text-gray-200 min-h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="bg-discord-dark border-b border-gray-800 sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="/" class="flex items-center space-x-2 font-bold text-xl text-white tracking-wide">
                <span class="text-2xl">🛡️</span>
                <span>Antigravity <span class="text-discord-blurple">Security</span></span>
            </a>
            <div class="hidden md:flex items-center space-x-4 pl-6 text-sm text-gray-400">
                <a href="/" class="hover:text-white transition">Home</a>
                <a href="/dashboard" class="hover:text-white transition">Dashboard</a>
                <a href="/terms" class="hover:text-white transition">Terms</a>
                <a href="/privacy" class="hover:text-white transition">Privacy Policy</a>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            {% if user %}
            <div class="flex items-center space-x-3 bg-discord-card px-3 py-1.5 rounded-full border border-gray-700">
                <img src="https://cdn.discordapp.com/avatars/{{ user.id }}/{{ user.avatar }}.png?size=64" 
                     onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'"
                     class="w-7 h-7 rounded-full" alt="avatar">
                <span class="text-sm font-medium text-white">{{ user.username }}</span>
                <a href="/auth/logout" class="text-xs text-red-400 hover:text-red-300 pl-2">Logout</a>
            </div>
            {% else %}
            <a href="/auth/login" class="bg-discord-blurple hover:bg-indigo-600 text-white font-medium text-sm px-4 py-2 rounded-lg transition shadow flex items-center space-x-2">
                <span>Login with Discord</span>
            </a>
            {% endif %}
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        {{ content | safe }}
    </main>

    <!-- Footer -->
    <footer class="bg-discord-dark border-t border-gray-800 py-6 text-center text-sm text-gray-500">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                &copy; 2026 Antigravity Security Suite • Built for Discord Communities
            </div>
            <div class="flex space-x-6 text-gray-400 text-xs">
                <a href="/terms" class="hover:text-white transition">Terms of Service</a>
                <a href="/privacy" class="hover:text-white transition">Privacy Policy</a>
                <a href="https://github.com/gokulravi0001/Karuppu" target="_blank" class="hover:text-white transition">GitHub</a>
            </div>
        </div>
    </footer>
</body>
</html>
